# FRAME Tips and Tricks

<aside class="notes"><p>A collection of things you should know when writing FRAME pallets. These aren&#39;t features of FRAME itself -- they&#39;re the sharp edges that catch people.</p>
</aside></script></section><section  data-markdown><script type="text/template">
1. **Determinism** -- Why floats and HashMaps break consensus
2. **Safe Math** -- Overflow, underflow, and how to avoid them
3. **Panics** -- Hidden ways your runtime can crash
4. **`no_std`** -- How the Wasm compilation model works and what breaks it
5. **Config** -- Type-level configuration, `Get<T>`, and bounded storage
</script></section><section  data-markdown><script type="text/template">
# Determinism
</script></section><section  data-markdown><script type="text/template">
## Why Determinism Matters

- Every validator re-executes every block.
- If validator A computes a different state root than validator B, **consensus breaks**.
- The runtime must be **perfectly deterministic**: same input, same output, every time, on every machine.
</script></section><section  data-markdown><script type="text/template">
## Floating Point Numbers are Non-Deterministic

```rust
fn main() {
    // Addition is not associative
    let a: f64 = (0.1 + 0.2) + 0.3;
    let b: f64 = 0.1 + (0.2 + 0.3);
    println!("{a} != {b}: {}", a != b);
    // a = 0.6000000000000001, b = 0.6

    // Multiplication is not distributive
    let x: f64 = 10.0 * (0.1 + 0.2);
    let y: f64 = 10.0 * 0.1 + 10.0 * 0.2;
    println!("{x} != {y}: {}", x != y);  // true
    // x = 3.0000000000000004, y = 3
}
```

If my balance is `10.000000000000001` DOT on one validator and `10.000000000000000` DOT on another, game over for consensus.
</script></section><section  data-markdown><script type="text/template">
## Primitives for Floating Point Numbers

- Fixed Point - general fixed point numbers
- "Per-thing" - fixed point numbers between `[0, 1]`
  - Because range is smaller, accuracy is higher

See all the useful arithmetic primitives:

https://docs.rs/sp-arithmetic/latest/sp_arithmetic/
</script></section><section  data-markdown><script type="text/template">
## PerThing: Fixed-Point Ratios

We represent ratios with "Fixed-Point" arithmetic types instead.

```rust
use sp_arithmetic::Perbill;

let p = Perbill::from_percent(25);
// println!("{:?}", p) → Perbill(250000000)
// internally stored as 250_000_000 / 1_000_000_000

let p = Perbill::from_rational(1, 4);
// println!("{:?}", p) → Perbill(250000000)

> p * 100u32;
> 25u32;
```

- `Perbill` represents `[0, 1]` with `u32` precision (parts per billion).
- Also: `Percent`, `Permill`, `PerU16`.
</script></section><section  data-markdown><script type="text/template">
## Fixed Point Numbers

For values outside `[0, 1]`:

```rust
use sp_arithmetic::FixedU64;

let x = FixedU64::from_rational(5, 2);
// println!("{:?}", x) → FixedU64(2500000000)
// internally stored as 2_500_000_000 / 1_000_000_000

let y = 10u32;
let z = x * y;
> 25
```

See [`sp-arithmetic`](https://paritytech.github.io/polkadot-sdk/master/sp_arithmetic/index.html) for the full set of types.
</script></section><section  data-markdown><script type="text/template">
## Other Sources of Non-Determinism

- **`HashMap` / `HashSet`**: iteration order is randomized per process. Use `BTreeMap` / `BTreeSet`.
- **`thread_rng()` / `rand`**: OS-sourced randomness differs per machine. Use on-chain randomness sources.
- **System time**: `Instant`, `SystemTime` are not available in `no_std` and would differ per validator.
- **Environment variables / file I/O**: not available in `no_std`, and would differ per machine.
</script></section><section  data-markdown><script type="text/template">
# Safe Math
</script></section><section  data-markdown><script type="text/template">
## Fallible Arithmetic

Addition, multiplication, and division can all silently produce wrong results:

- `u32::MAX * 2 / 2` panics in debug, **wraps silently** in release.
- `100 / 0` panics.
</script></section><section  data-markdown><script type="text/template">
## Safe Arithmetic

- **`Checked`** -- returns `None` on overflow:

  ```rust
  if let Some(outcome) = a.checked_mul(b) { ... } else { ... }
  ```

- **`Saturating`** -- clamps to `MAX`/`MIN`:

  ```rust
  let certain_output = a.saturating_mul(b);
  ```

In general, prefer using checked math. Only use saturating math if you are certain this is the behavior you want.

<aside class="notes"><p>Why would you ever want to saturate? Only when the number overflowing means the system is so fundamentally broken that clamping is the least-bad option.</p>
</aside></script></section><section  data-markdown><script type="text/template">
## Unsafe vs Safe Arithmetic

```rust
// Unsafe: bare operators can overflow or panic
let share = total_reward * user_stake / total_stake;

// Safe: checked operations with explicit error handling
let share = total_reward
  .checked_mul(&user_stake)
  .and_then(|x| x.checked_div(&total_stake))
  .ok_or(Error::<T>::ArithmeticOverflow)?;
```

Rules of thumb:

1. Every `+`, `-`, `*`, `/` on balances or quantities -- use `checked_` or `saturating_`.
2. Every `as` cast between numeric types -- use `TryInto`/`TryFrom` or `.into()`.
3. Every division -- consider whether zero is a possible divisor.
</script></section><section  data-markdown><script type="text/template">
## `u32` as `usize` is Safe in the Runtime

The runtime always compiles to **Wasm32** -- so `usize` is always 32 bits.

This means casting `u32 as usize` is safe and common for working with vectors and slices:

```rust
let index: u32 = some_storage_value;
let item = my_vec.get(index as usize);
```

But **never** cast `u64 as usize` -- it truncates silently in Wasm.

<aside class="notes"><p>This comes up constantly because FRAME storage types use <code>u32</code> for indices and lengths, but Rust&#39;s <code>Vec</code> and slice APIs require <code>usize</code>. In native (64-bit) test builds, <code>usize</code> is 64 bits, so the cast is also safe there (widening). The only dangerous direction would be <code>usize as u32</code> in native builds, but the runtime targets Wasm32 so this is also fine in practice.</p>
</aside></script></section><section  data-markdown><script type="text/template">
# Panics
</script></section><section  data-markdown><script type="text/template">
## The Core Rule

> Never panic in on-chain code!

Allowing callers to trigger a panic from a call can allow users to attack your chain by bypassing fees or other costs associated with executing logic on the blockchain.
</script></section><section  data-markdown><script type="text/template">
## Hidden Panics

`unwrap()` is obvious, but panics also hide in:

- **Slice/vector indexing**: `my_vec[i]` panics if `i >= len`
- **`.insert()` / `.remove()`**: can panic on out-of-bounds index
- **Division**: `x / 0` panics
- **Integer overflow**: `u32::MAX + 1` panics in debug mode
</script></section><section  data-markdown><script type="text/template">
## The Error Handling Hierarchy

From least safe to most safe:

```rust
// 1. Never do this in on-chain code
let value = maybe_value.unwrap();

// 2. Acceptable for truly impossible cases, with proof
let value = maybe_value.expect("checked to be Some on line above; qed");

// 3. Good: Return an error -- preferred in dispatchables
let value = maybe_value.ok_or(Error::<T>::ValueNotFound)?;

// 4. Good: defensive variant -- panics in tests, logs error in production
let value = maybe_value
  .defensive_ok_or(Error::<T>::ValueNotFound)?;
```

<aside class="notes"><p>QED = &quot;quod erat demonstrandum&quot; (&quot;which was to be demonstrated&quot;). It signals that the preceding code proves this unwrap is safe.</p>
</aside></script></section><section  data-markdown><script type="text/template">
## Defensive Traits

`frame_support` provides [defensive](https://paritytech.github.io/substrate/master/frame_support/traits/trait.Defensive.html) utilities that **panic in tests, log an error in production**:

```rust
// Assert a condition you believe is always true
defensive_assert!(amount <= total, "amount should never exceed total");

// Unwrap an Option/Result defensively
let x = maybe_value.defensive_unwrap_or(default);
let x = maybe_value.defensive_ok_or(Error::<T>::Impossible)?;
```
</script></section><section  data-markdown><script type="text/template">
## Panic Checklist

When reviewing pallet code, check:

1. **`unwrap()` / `expect()`** -- each one needs justification.
2. **Direct indexing** (`vec[i]`, `slice[i]`) -- should be `.get(i)`.
3. **Arithmetic operators** -- should be checked/saturating.
4. **Division** -- is the divisor guaranteed non-zero?
5. **`as` casts** -- should be `try_into()`.
</script></section><section  data-markdown><script type="text/template">
# `no_std`
</script></section><section  data-markdown><script type="text/template">
## Why Wasm?

- The Substrate runtime compiles to **Wasm** and lives on-chain.
- Wasm runtimes cannot use the standard library (`std`) -- no filesystem, no networking, no OS.
- Every runtime crate must compile in `no_std` mode.

<aside class="notes"><ul>
<li><code>std</code> is the interface to common OS abstractions.</li>
<li><code>core</code> is a subset of <code>std</code> that makes no assumption about the OS.</li>
<li>A <code>no_std</code> crate relies on <code>core</code> rather than <code>std</code>.</li>
</ul>
</aside></script></section><section  data-markdown><script type="text/template">
## The Feature Flag Convention

Every Substrate runtime crate follows this pattern:

```rust
#![cfg_attr(not(feature = "std"), no_std)]
```

And in `Cargo.toml`:

```toml
[dependencies]
dep1 = { version = "1.0.0", default-features = false }
dep2 = { version = "1.0.0", default-features = false }

[features]
default = ["std"]
std = [
  "dep1/std",
  "dep2/std",
]
```

<aside class="notes"><ul>
<li><code>default-features = false</code> disables the dependency&#39;s <code>std</code> feature by default.</li>
<li><code>std = [&quot;dep1/std&quot;]</code> means &quot;if my std is enabled, enable my dependency&#39;s std too.&quot;</li>
<li>Missing a single dependency from the <code>std</code> feature list is one of the most common build errors.</li>
</ul>
</aside></script></section><section  data-markdown><script type="text/template">
## The Error You'll See

```sh
error: duplicate lang item in crate sp_io (which frame_support depends on): panic_impl.
  |
  = no​te: the lang item is first defined in crate std (which serde depends on)
```

This means a dependency pulled in `std` when compiling for Wasm. Fix: ensure that dependency has `default-features = false` and is included in the `std` feature list.
</script></section><section  data-markdown><script type="text/template">
## Other Common Feature Flags

`std` is not the only feature flag. Pallets and runtimes use several others:

```toml
[features]
default = ["std"]
std = [...]
runtime-benchmarks = [
  "dep1/runtime-benchmarks",
  "dep2/runtime-benchmarks",
]
try-runtime = [
  "dep1/try-runtime",
  "dep2/try-runtime",
]
```

- **`runtime-benchmarks`** -- enables benchmarking code. Relaxes certain checks (e.g. allows minting tokens) so benchmarks can set up worst-case scenarios.
- **`try-runtime`** -- enables `try-state` hooks that validate storage invariants. Used by `try-runtime-cli` to test migrations against live chain state.

<aside class="notes"><p>These follow the same propagation pattern as <code>std</code> -- every dependency that supports the feature must be listed. The <code>runtime-benchmarks</code> feature is particularly important to understand: code gated behind it runs only during benchmarking, not in production. This is how benchmarks create accounts, mint balances, and set up state without going through normal extrinsic checks.</p>
</aside></script></section><section  data-markdown><script type="text/template">
## Logging in the Runtime

Use the `log` crate with a target to add debug output:

```rust
log::info!(target: "my_pallet", "processing claim for {:?}", who);
log::debug!(target: "my_pallet", "storage read: {:?}", value);
```

To see the output, set `RUST_LOG` when running your node:

```sh
RUST_LOG=my_pallet=debug ./target/release/node-template --dev
```

<aside class="notes"><p>Log statements are only evaluated if the corresponding level and target match. The <code>log</code> crate itself doesn&#39;t print anything -- the node&#39;s logging layer (built on <code>sp_tracing</code>) handles the output. In tests, call <code>sp_tracing::try_init_simple()</code> to enable log output.</p>
</aside></script></section><section  data-markdown><script type="text/template">
## Logging Considerations

- Log messages are sent from the Wasm runtime to the node via host functions.
- Every string literal in a log increases the **Wasm blob size**.
- Use `log::debug!` or `log::trace!` for verbose output -- these are compiled in but only evaluated when the log level is set.
- Avoid logging large structs in production code.

```rust
// Good: only evaluated when RUST_LOG=my_pallet=trace
log::trace!(target: "my_pallet", "full state: {:?}", big_struct);

// Bad: format string always exists in the Wasm blob
log::info!(target: "my_pallet", "this very long message with lots of context...");
```
</script></section><section  data-markdown><script type="text/template">
## `if_std!`

Run code only when `std` is enabled -- useful for quick debugging in tests or native builds:

```rust
sp_std::if_std! {
  println!("hello world!");
  dbg!(some_value);
}
```

This compiles to nothing in Wasm -- it only runs when `std` is enabled.
</script></section><section  data-markdown><script type="text/template">
# Config
</script></section><section  data-markdown><script type="text/template">
## `<Type as Trait>::AssociatedType`

The single most important Rust syntax for reading FRAME code:

```rust
trait Config {
  type Extrinsic;
  type Header: HeaderT;
}

// Type alias shorthand -- very common in Substrate
pub type ExtrinsicFor<C> = <C as Config>::Extrinsic;

// Nested associated types
trait HeaderT {
  type Number;
}
pub type NumberFor<C> = <<C as Config>::Header as HeaderT>::Number;
```
</script></section><section  data-markdown><script type="text/template">
## `trait Get`: Values Through Types

```rust
pub trait Get<T> {
  fn get() -> T;
}
```

Used to pass configuration constants at the type level:

```rust
parameter_types! {
  pub const MaxItems: u32 = 100;
}

// Expands to:
pub struct MaxItems;
impl Get<u32> for MaxItems {
  fn get() -> u32 { 100 }
}
```
</script></section><section  data-markdown><script type="text/template">
## Why Types Instead of Values?

```rust
// The bound lives in the TYPE -- zero extra bytes in storage
pub struct BoundedVec<T, S: Get<u32>>(
  Vec<T>,
  PhantomData<S>,  // PhantomData is zero-sized
);
```

Why not store the bound as a `u32` field alongside the data?

- `PhantomData<S>` adds **zero bytes** to the SCALE encoding -- the bound exists only at compile time.
- The compiler can enforce the max length and derive `MaxEncodedLen` automatically.

Compiler-level constraints, zero storage overhead.
</script></section><section  data-markdown><script type="text/template">
## All Storage Must Implement `MaxEncodedLen`

FRAME requires every storage type to implement `MaxEncodedLen` -- the **maximum** number of bytes that type could ever occupy when SCALE-encoded.

```rust
// This works: BoundedVec has a known max size
#[pallet::storage]
pub type Items<T> = StorageMap<_, Blake2_128Concat, T::AccountId, BoundedVec<u8, MaxItems>>;

// This does NOT compile: Vec has no upper bound
#[pallet::storage]
pub type Items<T> = StorageMap<_, Blake2_128Concat, T::AccountId, Vec<u8>>;
```

<aside class="notes"><p>This is why <code>BoundedVec</code>, <code>BoundedBTreeMap</code>, and <code>BoundedBTreeSet</code> exist -- they are the bounded equivalents of <code>Vec</code>, <code>BTreeMap</code>, and <code>BTreeSet</code> that implement <code>MaxEncodedLen</code>. The <code>#[pallet::without_storage_info]</code> attribute silently disables this check. If you see that attribute, remove it and fix the types instead.</p>
</aside></script></section><section  data-markdown><script type="text/template">
## Why `MaxEncodedLen` Matters

- **PoV (Proof of Validity)**: parachains must prove storage reads to the relay chain. The proof size is bounded by `MaxEncodedLen`.
- **Weight calculation**: `proof_size` in weights comes from the max bytes each storage read could return.
- **Without it**, FRAME cannot guarantee that a block stays within its PoV budget.
</script></section><section  data-markdown><script type="text/template">
## Use Properly Sized Types

Every byte in storage costs weight to read, write, and prove. Don't use `u64` when `u8` will do.

```rust
// Bad: 100 items max doesn't need 4 bytes
type MaxItems: Get<u32>; // max 4,294,967,295

// Good: u8 is enough for a max of 100
type MaxItems: Get<u8>;  // max 255
```

This compounds in storage structs:

```rust
// Every field is bigger than it needs to be
pub struct GameState {
  round: u64,     // never exceeds 20 → use u8
  lives: u64,     // never exceeds 5  → use u8
  score: u64,     // never exceeds 10_000 → use u16
  seed: u64,      // actually needs u64 ✅
}
```

Smaller types mean smaller SCALE encoding, less PoV cost, and tighter `MaxEncodedLen` bounds.

<aside class="notes"><p>This also applies to storage keys and map values. A <code>StorageMap&lt;_, _, u64, _&gt;</code> uses 8 bytes per key in proofs. If your IDs fit in <code>u16</code>, use <code>u16</code>. The savings multiply across every storage read and write in a block.</p>
</aside></script></section><section  data-markdown><script type="text/template">
## The `Config` Trait Pattern

Every FRAME pallet is generic over a `Config` trait:

```rust
trait Config {
  /// Maximum number of items.
  type MaxItems: Get<u32>;
  /// How to convert between balance types.
  type BalanceConverter: Convert<u64, u32>;
}
```
</script></section><section  data-markdown><script type="text/template">
